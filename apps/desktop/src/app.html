<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Irontion</title>
    <script>
      // Apply the saved theme before first paint so the window never flashes the wrong theme.
      (function () {
        var mode = "system";
        try { mode = localStorage.getItem("irontion.theme") || "system"; } catch (e) {}
        var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        // Saved accent color and block shape (see preferences.svelte.ts).
        try {
          var root = document.documentElement;
          var vars = JSON.parse(localStorage.getItem("irontion.accentVars") || "null");
          if (vars) {
            var accent = vars[dark ? "dark" : "light"];
            root.style.setProperty("--accent", accent.accent);
            root.style.setProperty("--accent-soft", accent.soft);
            root.style.setProperty("--accent-ink", accent.ink);
          }
          root.dataset.cellShape = localStorage.getItem("irontion.cellShape") || "square";
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
