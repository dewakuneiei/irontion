[package]
name = "irontion-core"
version = "0.2.0"
edition = "2024"
description = "Irontion business logic and SQLite storage, shared by every app"
authors = ["dewakuneiei"]
repository = "https://github.com/dewakuneiei/irontion"
license = "Apache-2.0"
publish = false

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"

[dev-dependencies]
serde_json = "1"
